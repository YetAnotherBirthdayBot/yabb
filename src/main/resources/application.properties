# General
yabb.general.app.version=${quarkus.application.version:N/A}

# Token
yabb.discord.token=${TOKEN}

# yabb API URL
quarkus.rest-client.config-api.url=${API_URL}
quarkus.rest-client.birthday-api.url=${API_URL}
quarkus.rest-client.birthday-schedule-api.url=${API_URL}

# Embed Color Config
yabb.embed-color.success.color.integer=${EMBED_SUCCESS_COLOR_INT:16442555}
yabb.embed-color.warning.color.integer=${EMBED_WARNING_COLOR_INT:16412441}
yabb.embed-color.destructive.color.integer=${EMBED_DESTRUCTIVE_COLOR_INT:2688581}

#Port
quarkus.http.port=${PORT:8080}
quarkus.management.enabled=true
quarkus.management.port=${MANAGEMENT_PORT:9000}

# Logging Level
quarkus.log.level=${GLOBAL_LOG_LEVEL:INFO}

# Analytics
quarkus.analytics.disabled=true

# Banner
quarkus.banner.path=banner.txt

# Uncomment these when u wanna log API responses
# quarkus.rest-client.logging.scope=request-response
# quarkus.rest-client.logging.body-limit=2000